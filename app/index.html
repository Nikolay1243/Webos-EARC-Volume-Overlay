<!doctype html>
<html><head><meta charset="utf-8"><title>eARC Volume Overlay</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;color:#fff;background:transparent}
#setup{display:none;position:absolute;top:0;right:0;bottom:0;left:0;padding:110px 150px;background:radial-gradient(ellipse at 50% 35%,#25252a 0%,#111114 55%,#050506 100%)}body.setup-mode #setup{display:block}.panel{width:940px;margin:0 auto;text-align:center}.mark{width:116px;height:116px;margin:0 auto 30px;border-radius:26px;background:#171719 url('largeIcon-labeled.png') center/116px 116px no-repeat}h1{margin:0;font-size:54px;font-weight:300;letter-spacing:-.02em}.description{margin:20px auto 38px;max-width:760px;color:#b7b7bd;font-size:25px;line-height:1.45}#status{display:inline-block;min-width:270px;padding:12px 22px;margin-bottom:42px;border:1px solid #3b3b42;border-radius:999px;background:#19191d;color:#c8c8ce;font-size:22px}#status.enabled{border-color:#3f7255;color:#9fe0b6}#status.error{border-color:#8c4a4a;color:#ffaaaa}.buttons{display:flex;justify-content:center}button{min-width:215px;margin:0 10px;padding:20px 30px;border:2px solid #4a4a51;border-radius:17px;background:#202025;color:#eee;font-size:25px;outline:none}button:focus{border-color:#fff;background:#303037;transform:scale(1.05)}.size{margin-top:34px}.size .label{display:block;margin-bottom:14px;color:#9a9aa1;font-size:21px}.size button{min-width:170px;padding:14px 24px;font-size:22px}.size button.selected{border-color:#3f7255;color:#9fe0b6}.size button.selected:focus{border-color:#9fe0b6}.note{margin-top:34px;color:#77777f;font-size:19px}
#overlay{display:none;position:absolute;right:62px;bottom:62px;font-size:20px;width:9.4em;transform:scale(.94);transform-origin:bottom right;opacity:0;padding:1.15em 1.4em;text-align:center;background:rgba(16,16,18,.88);border:1px solid rgba(255,255,255,.17);border-radius:1.1em;box-shadow:0 10px 35px rgba(0,0,0,.48);transition:opacity 150ms ease,transform 180ms ease}body.overlay-mode #overlay{display:block}#overlay.show{opacity:1;transform:scale(1)}#value{font-size:4.1em;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;transition:opacity 120ms ease}#value.pending{opacity:.45}
#volume-track{height:.2em;min-height:2px;margin-top:.9em;overflow:hidden;border-radius:.1em;background:rgba(255,255,255,.18)}#volume-fill{width:100%;height:100%;border-radius:.1em;background:#fff;transform:scaleX(0);transform-origin:left center;transition:transform 180ms ease-out}
@media (prefers-reduced-motion:reduce){#volume-fill{transition:none}}
</style></head><body>
<main id="setup"><div class="panel"><div class="mark"></div><h1>eARC Volume Overlay</h1><p class="description">Shows the soundbar or receiver's numeric volume in the bottom-right corner whenever it changes.</p><div id="status">Checking status…</div><div class="buttons"><button id="enable">Enable</button><button id="disable">Disable</button><button id="test">Test overlay</button></div><div class="size"><span class="label">Overlay size</span><div class="buttons"><button id="size-small">Small</button><button id="size-medium">Medium</button><button id="size-large">Large</button></div></div><p class="note">Requires a rooted TV and Homebrew Channel. Enabled stays on after power-off. Disable here before uninstalling.</p></div></main>
<div id="overlay"><div id="value">0</div><div id="volume-track" aria-hidden="true"><div id="volume-fill"></div></div></div>
<script src="root-exec.js"></script>
<script>
(function(){
var APP_ID='com.github.nikolay1243.earcvolume',SERVICE='luna://org.webosbrew.hbchannel.service/exec',HOOK='/var/lib/webosbrew/init.d/91-earc-volume-overlay',PIDFILE='/tmp/earc-volume-overlay.pid';
var SIZES={small:11,medium:15,large:20},SIZE_KEY='earc.overlaySize',overlaySize='large',returnFocus=null;
var overlay=document.getElementById('overlay'),value=document.getElementById('value'),volumeFill=document.getElementById('volume-fill'),status=document.getElementById('status'),closeTimer=null,closeAnimationTimer=null,showTimer=null,focusTimer=null;
var findApp=['APP_DIR=','for BASE in /media/developer/apps/usr/palm/applications /media/cryptofs/apps/usr/palm/applications; do','  if [ -f "$BASE/'+APP_ID+'/runtime/watcher.js" ]; then APP_DIR="$BASE/'+APP_ID+'"; break; fi','done','[ -n "$APP_DIR" ] || { echo app-not-found; exit 1; }'].join('\n');
var stopWatcher=['if [ -f "'+PIDFILE+'" ]; then','  PID=$(cat "'+PIDFILE+'" 2>/dev/null || true)','  if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then','    CMD=$(tr "\\000" " " < "/proc/$PID/cmdline" 2>/dev/null || true)','    case "$CMD" in *earc-watcher*|*watcher.js*) kill "$PID" 2>/dev/null || true;; esac','  fi','fi','rm -f "'+PIDFILE+'"'].join('\n');
var enableCommand=['set -e','[ "$(id -u)" = 0 ] || { echo root-required >&2; exit 1; }',findApp,'mkdir -p /var/lib/webosbrew/init.d','chmod 755 "$APP_DIR/runtime/91-earc-volume-overlay"','ln -sf "$APP_DIR/runtime/91-earc-volume-overlay" "'+HOOK+'"','if [ -f /var/lib/earc-volume-overlay/watcher.pid ]; then','  OLD=$(cat /var/lib/earc-volume-overlay/watcher.pid 2>/dev/null || true)','  [ -z "$OLD" ] || kill "$OLD" 2>/dev/null || true','fi','rm -rf /var/lib/earc-volume-overlay',stopWatcher,'"'+HOOK+'"','echo enabled'].join('\n');
var disableCommand=[stopWatcher,'rm -f "'+HOOK+'"','echo disabled'].join('\n');
var statusCommand=['if [ -L "'+HOOK+'" ] || [ -f "'+HOOK+'" ]; then','  PID=$(cat "'+PIDFILE+'" 2>/dev/null || true)','  if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then echo enabled-running; else echo enabled-stopped; fi','else echo disabled; fi'].join('\n');
function loadSize(){try{var saved=window.localStorage&&window.localStorage.getItem(SIZE_KEY);if(saved&&SIZES[saved])overlaySize=saved}catch(e){}}
function applySize(){overlay.style.fontSize=SIZES[overlaySize]+'px';for(var name in SIZES){var b=document.getElementById('size-'+name);if(b)b.className=name===overlaySize?'selected':''}}
function setSize(name){if(!SIZES[name])return;overlaySize=name;try{if(window.localStorage)window.localStorage.setItem(SIZE_KEY,name)}catch(e){}applySize()}
function paramsOf(input){var p=input;try{if(typeof p==='string')p=JSON.parse(p)}catch(e){p={}}if(!p||typeof p!=='object')p={};if(p.params&&typeof p.params==='object')p=p.params;return p}
function hasVolume(p){return Object.prototype.hasOwnProperty.call(p,'volume')||Object.prototype.hasOwnProperty.call(p,'mute')}
function rootExec(command,callback){window.earcRootExec(command,callback)}
function setStatus(text,kind){status.textContent=text;status.className=kind||''}
function refreshStatus(){setStatus('Checking status…');rootExec(statusCommand,function(error,output){if(error){setStatus(error.message,'error');return}if(output.indexOf('enabled-running')!==-1)setStatus('Enabled and running','enabled');else if(output.indexOf('enabled-stopped')!==-1)setStatus('Enabled; restart required','error');else setStatus('Disabled')})}
function clearOverlayTimers(){if(closeTimer)window.clearTimeout(closeTimer);if(closeAnimationTimer)window.clearTimeout(closeAnimationTimer);if(showTimer)window.clearTimeout(showTimer);if(focusTimer)window.clearTimeout(focusTimer);closeTimer=closeAnimationTimer=showTimer=focusTimer=null}
function configureInput(passive){
if(!window.PalmSystem)return;
if(PalmSystem.setInputRegion)PalmSystem.setInputRegion([{x:0,y:0,width:passive?0:1920,height:passive?0:1080}]);
if(PalmSystem.setKeyMask)PalmSystem.setKeyMask(['KeyMaskDefault'])
}
function setWindowType(type){
if(!window.PalmSystem)return;
var passive=type==='overlay';
if(PalmSystem.setWindowProperty){PalmSystem.setWindowProperty('needFocus',passive?'false':'true');PalmSystem.setWindowProperty('_WEBOS_WINDOW_TYPE',passive?'_WEBOS_WINDOW_TYPE_FLOATING':'_WEBOS_WINDOW_TYPE_CARD')}
configureInput(passive)
}
function showSetup(){clearOverlayTimers();setWindowType('card');document.body.className='setup-mode';overlay.className='';refreshStatus();var target=document.getElementById(returnFocus||'enable');returnFocus=null;window.setTimeout(function(){target.focus()},30);if(window.PalmSystem&&PalmSystem.activate)PalmSystem.activate()}
function showOverlay(input,preview){
var p=paramsOf(input),n=Number(p.volume),alreadyVisible=document.body.className==='overlay-mode'&&overlay.className==='show';
if(!isFinite(n))n=0;n=Math.max(0,Math.min(100,Math.round(n)));
clearOverlayTimers();
if(!alreadyVisible)setWindowType('overlay');
var displayed=(p.mute===true||p.muted===true)?0:n;
value.textContent=String(displayed);value.className=p.pending===true?'pending':'';volumeFill.style.transform='scaleX('+(displayed/100)+')';
document.body.className='overlay-mode';
if(!alreadyVisible){overlay.className='';showTimer=window.setTimeout(function(){overlay.className='show';showTimer=null},20)}
// Activate only on appearance. Releasing focus must happen after the native
// window has been created; initial window creation can reacquire it.
if(!alreadyVisible&&window.PalmSystem&&PalmSystem.activate)PalmSystem.activate();
configureInput(true);
focusTimer=window.setTimeout(function(){
focusTimer=null;
if(document.body.className!=='overlay-mode')return;
if(window.PalmSystem&&PalmSystem.setWindowProperty)PalmSystem.setWindowProperty('needFocus','false');
configureInput(true)
},60);
// The window stays resident after fading out: a cold web-app launch takes
// 1-2 s on these TVs, while relaunching a running app is near-instant.
// While hidden it is transparent, passive and has a zero input region.
closeTimer=window.setTimeout(function(){overlay.className='';closeAnimationTimer=window.setTimeout(function(){closeAnimationTimer=null;if(preview)showSetup();else configureInput(true)},220)},1850)
}
document.getElementById('enable').onclick=function(){setStatus('Enabling…');rootExec(enableCommand,function(error){if(error)setStatus(error.message,'error');else refreshStatus()})};
document.getElementById('disable').onclick=function(){setStatus('Disabling…');rootExec(disableCommand,function(error){if(error)setStatus(error.message,'error');else refreshStatus()})};
document.getElementById('test').onclick=function(){returnFocus='test';showOverlay({volume:42,mute:false},true)};
['small','medium','large'].forEach(function(name){document.getElementById('size-'+name).onclick=function(){setSize(name);returnFocus='size-'+name;showOverlay({volume:42,mute:false},true)}});
document.addEventListener('visibilitychange',function(){if(document.hidden&&document.body.className==='setup-mode'){clearOverlayTimers();window.close()}});
var rows=[['enable','disable','test'],['size-small','size-medium','size-large']];
function focusAt(row,column){var ids=rows[row];document.getElementById(ids[Math.max(0,Math.min(ids.length-1,column))]).focus()}
document.addEventListener('keydown',function(event){if(document.body.className!=='setup-mode')return;if(event.keyCode===461||event.keyCode===27){event.preventDefault();clearOverlayTimers();window.close();return}var id=document.activeElement&&document.activeElement.id,row=-1,column=-1;for(var r=0;r<rows.length;r++){var c=rows[r].indexOf(id);if(c!==-1){row=r;column=c}}if(row<0)return;if(event.keyCode===37&&column>0)focusAt(row,column-1);else if(event.keyCode===39&&column<rows[row].length-1)focusAt(row,column+1);else if(event.keyCode===38&&row>0)focusAt(row-1,column);else if(event.keyCode===40&&row<rows.length-1)focusAt(row+1,rows[row+1].indexOf('size-'+overlaySize));else return;event.preventDefault()});
function relaunch(input){var updated=paramsOf(input);if(hasVolume(updated)){if(document.body.className!=='setup-mode'||document.hidden)showOverlay(updated,false)}else showSetup()}
window.webOSRelaunch=function(){var p={};try{p=window.PalmSystem?PalmSystem.launchParams:{}}catch(e){}relaunch(p);return true};
document.addEventListener('webOSRelaunch',function(event){if(event&&event.detail!==undefined)relaunch(event.detail)},true);
loadSize();applySize();
var initial={};try{initial=window.PalmSystem?PalmSystem.launchParams:{}}catch(e){}initial=paramsOf(initial);if(hasVolume(initial))showOverlay(initial,false);else showSetup();
}());
</script></body></html>
