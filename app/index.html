<!doctype html>
<html><head><meta charset="utf-8"><title>eARC Volume Overlay</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;color:#fff;background:transparent}
#setup{display:none;position:absolute;top:0;right:0;bottom:0;left:0;padding:54px 100px;overflow-y:auto;background:radial-gradient(ellipse at 50% 35%,#25252a 0%,#111114 55%,#050506 100%)}body.setup-mode #setup{display:block}.panel{max-width:1080px;margin:0 auto;text-align:center}.mark{width:80px;height:80px;margin:0 auto 12px;border-radius:26px;background:#171719 url('largeIcon-labeled.png') center/cover no-repeat}h1{margin:0;font-size:54px;font-weight:300;letter-spacing:-.02em}#status{display:inline-block;min-width:270px;padding:12px 22px;margin:18px 0;border:1px solid #3b3b42;border-radius:999px;background:#19191d;color:#c8c8ce;font-size:22px}#status.enabled{border-color:#3f7255;color:#9fe0b6}#status.error{border-color:#8c4a4a;color:#ffaaaa}.buttons{display:flex;justify-content:center}button{min-width:215px;margin:0 10px;padding:20px 30px;border:2px solid #4a4a51;border-radius:17px;background:#202025;color:#eee;font-size:25px;outline:none}button:focus{border-color:#fff;background:#303037;transform:scale(1.05)}.note{margin-top:20px;color:#77777f;font-size:19px}
#overlay{display:none;position:absolute;right:62px;bottom:62px;min-width:188px;transform:scale(.94);transform-origin:bottom right;opacity:0;padding:23px 28px;text-align:center;background:rgba(16,16,18,.88);border:1px solid rgba(255,255,255,.17);border-radius:22px;box-shadow:0 10px 35px rgba(0,0,0,.48);transition:opacity 150ms ease,transform 180ms ease}body.overlay-mode #overlay{display:block}#overlay.show{opacity:1;transform:scale(1);transition:none}#value{font-size:82px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
#readout{white-space:nowrap}#mute-icon{font-size:44px;vertical-align:10px;margin-right:12px}
#volume-track{height:4px;margin-top:18px;overflow:hidden;border-radius:2px;background:rgba(255,255,255,.18)}#volume-fill{width:100%;height:100%;border-radius:2px;background:#fff;transform:scaleX(0);transform-origin:left center;transition:transform 180ms ease-out}
.sources{margin:26px auto 0;padding:18px 36px 22px;border:1px solid #43434b;border-radius:18px;background:#1c1c21;text-align:left}.sources h2{margin:0 0 8px;font-size:30px;font-weight:500}
.sources button,.sources input{min-width:0;margin:5px 8px 5px 0;padding:9px 17px;font-size:23px;border-radius:10px}
.sources input{width:275px;border:2px solid #55555e;background:#111114;color:#fff}
.sources input:focus{border-color:white;outline:none}
.sources button[aria-pressed=true]{background:#306044}
.sources label,#scale-label{display:inline-block;margin-right:10px;font-size:22px}
#source-message{min-height:29px;margin:8px 0 0;color:#c9dbf1;font-size:22px}
#source-message.error{color:#ffaaaa}
#room-list:empty{display:none}
@media (prefers-reduced-motion:reduce){#volume-fill{transition:none}}
</style></head><body>
<main id="setup">
  <div class="panel">
    <div class="mark"></div><h1>eARC Volume Overlay</h1>
    <div id="status">Checking status…</div>
    <div class="buttons"><button id="enable">Enable</button><button id="disable">Disable</button><button id="test">Test overlay</button></div>
    <section class="sources" aria-labelledby="source-heading">
      <h2 id="source-heading">Volume source</h2>
      <div><button id="source-webos" aria-pressed="false">webOS / HDMI ARC</button><button id="source-sonos" aria-pressed="false">Sonos</button></div>
      <div id="sonos-options" hidden>
        <button id="find-rooms">Find Sonos rooms</button>
        <div id="room-list" aria-label="Sonos rooms"></div>
        <div><label for="sonos-host">Speaker IP</label><input id="sonos-host" type="text" inputmode="decimal" maxlength="15" placeholder="IPv4 address" spellcheck="false">
        <button id="test-room">Check volume</button></div>
        <div role="group" aria-labelledby="scale-label">
          <span id="scale-label">TV display scale</span>
          <button id="scale-native" aria-pressed="true">0–100 (Sonos)</button>
          <button id="scale-half" aria-pressed="false">0–50</button>
        </div>
      </div>
      <button id="save-source">Save source</button>
      <p id="source-message" role="status" aria-live="polite"></p>
    </section>
    <p class="note">Requires a rooted TV and Homebrew Channel. Enabled stays on after power-off. Disable here before uninstalling.</p>
  </div>
</main>
<div id="overlay"><div id="readout"><span id="mute-icon" aria-label="Muted" hidden>🔇</span><span id="value">0</span></div><div id="volume-track" aria-hidden="true"><div id="volume-fill"></div></div></div>
<script src="root-exec.js"></script>
<script src="source-settings.js"></script>
<script>
(function(){
var APP_ID='com.github.nikolay1243.earcvolume',SERVICE='luna://org.webosbrew.hbchannel.service/exec',HOOK='/var/lib/webosbrew/init.d/91-earc-volume-overlay',PIDFILE='/tmp/earc-volume-overlay.pid';
var overlay=document.getElementById('overlay'),value=document.getElementById('value'),volumeFill=document.getElementById('volume-fill'),status=document.getElementById('status'),closeTimer=null,closeAnimationTimer=null,focusTimer=null;
var findApp=['APP_DIR=','for BASE in /media/developer/apps/usr/palm/applications /media/cryptofs/apps/usr/palm/applications; do','  if [ -f "$BASE/'+APP_ID+'/runtime/watcher.js" ]; then APP_DIR="$BASE/'+APP_ID+'"; break; fi','done','[ -n "$APP_DIR" ] || { echo app-not-found; exit 1; }'].join('\n');
var enableCommand=['set -e','[ "$(id -u)" = 0 ] || { echo root-required >&2; exit 1; }',findApp,'mkdir -p /var/lib/webosbrew/init.d','chmod 755 "$APP_DIR/runtime/91-earc-volume-overlay"','ln -sf "$APP_DIR/runtime/91-earc-volume-overlay" "'+HOOK+'"','if [ -f /var/lib/earc-volume-overlay/watcher.pid ]; then','  OLD=$(cat /var/lib/earc-volume-overlay/watcher.pid 2>/dev/null || true)','  [ -z "$OLD" ] || kill "$OLD" 2>/dev/null || true','fi','rm -rf /var/lib/earc-volume-overlay','"'+HOOK+'"','echo enabled'].join('\n');
var disableCommand=['if [ -f "'+PIDFILE+'" ]; then','  PID=$(cat "'+PIDFILE+'" 2>/dev/null || true)','  if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then','    CMD=$(tr "\\000" " " < "/proc/$PID/cmdline" 2>/dev/null || true)','    case "$CMD" in *watcher.js*) kill "$PID" 2>/dev/null || true;; esac','  fi','fi','rm -f "'+PIDFILE+'" "'+HOOK+'"','echo disabled'].join('\n');
var statusCommand=['if [ -L "'+HOOK+'" ] || [ -f "'+HOOK+'" ]; then','  PID=$(cat "'+PIDFILE+'" 2>/dev/null || true)','  if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then echo enabled-running; else echo enabled-stopped; fi','else echo disabled; fi'].join('\n');
function paramsOf(input){var p=input;try{if(typeof p==='string')p=JSON.parse(p)}catch(e){p={}}if(!p||typeof p!=='object')p={};if(p.params&&typeof p.params==='object')p=p.params;return p}
function hasVolume(p){return Object.prototype.hasOwnProperty.call(p,'volume')||Object.prototype.hasOwnProperty.call(p,'mute')}
function rootExec(command,callback){window.earcRootExec(command,callback)}
var sources=window.createVolumeSourceSettings(rootExec,findApp);
function setStatus(text,kind){status.textContent=text;status.className=kind||''}
function refreshStatus(){setStatus('Checking status…');rootExec(statusCommand,function(error,output){if(error){setStatus(error.message,'error');return}if(output.indexOf('enabled-running')!==-1)setStatus('Enabled and running','enabled');else if(output.indexOf('enabled-stopped')!==-1)setStatus('Enabled; restart required','error');else setStatus('Disabled')})}
function clearOverlayTimers(){if(closeTimer)window.clearTimeout(closeTimer);if(closeAnimationTimer)window.clearTimeout(closeAnimationTimer);if(focusTimer)window.clearTimeout(focusTimer);closeTimer=closeAnimationTimer=focusTimer=null}
function configureInput(passive){
if(!window.PalmSystem)return;
if(PalmSystem.setInputRegion)PalmSystem.setInputRegion([{x:0,y:0,width:passive?0:1920,height:passive?0:1080}]);
if(PalmSystem.setKeyMask)PalmSystem.setKeyMask(['KeyMaskDefault'])
}
function setWindowType(type){
if(!window.PalmSystem)return;
var passive=type==='overlay';
if(PalmSystem.setWindowProperty){PalmSystem.setWindowProperty('needFocus',passive?'false':'true');PalmSystem.setWindowProperty('_WEBOS_WINDOW_TYPE',passive?'_WEBOS_WINDOW_TYPE_FLOATING':'_WEBOS_WINDOW_TYPE_CARD')}
configureInput(passive)
}
function showSetup(resumeDraft){clearOverlayTimers();setWindowType('card');document.body.className='setup-mode';overlay.className='';refreshStatus();if(!resumeDraft)sources.load();window.setTimeout(function(){document.getElementById(resumeDraft?'test':'enable').focus()},30);if(window.PalmSystem&&PalmSystem.activate)PalmSystem.activate()}
function showOverlay(input,preview){
var p=paramsOf(input),n=Number(p.volume),alreadyVisible=document.body.className==='overlay-mode'&&overlay.className==='show';
if(!isFinite(n))n=0;n=Math.max(0,Math.min(100,Math.round(n)));
clearOverlayTimers();
if(!alreadyVisible)setWindowType('overlay');
document.getElementById('mute-icon').hidden=!(p.mute===true||p.muted===true);
var percent=typeof p.volumePercent==='number'&&isFinite(p.volumePercent)?Math.max(0,Math.min(100,p.volumePercent)):n;
value.textContent=String(n);volumeFill.style.transform='scaleX('+(percent/100)+')';
document.body.className='overlay-mode';
overlay.className='show';
// Activate only on appearance. Releasing focus must happen after the native
// window has been created; initial window creation can reacquire it.
if(!alreadyVisible&&window.PalmSystem&&PalmSystem.activate)PalmSystem.activate();
configureInput(true);
focusTimer=window.setTimeout(function(){
focusTimer=null;
if(document.body.className!=='overlay-mode')return;
if(window.PalmSystem&&PalmSystem.setWindowProperty)PalmSystem.setWindowProperty('needFocus','false');
configureInput(true)
},60);
closeTimer=window.setTimeout(function(){overlay.className='';closeAnimationTimer=window.setTimeout(function(){if(preview)showSetup(true);else window.close()},220)},1850)
}
document.getElementById('enable').onclick=function(){setStatus('Enabling…');rootExec(enableCommand,function(error){if(error)setStatus(error.message,'error');else refreshStatus()})};
document.getElementById('disable').onclick=function(){setStatus('Disabling…');rootExec(disableCommand,function(error){if(error)setStatus(error.message,'error');else refreshStatus()})};
document.getElementById('test').onclick=function(){showOverlay({volume:sources.previewVolume(42),volumePercent:42,mute:false},true)};
document.addEventListener('visibilitychange',function(){if(document.hidden&&document.body.className==='setup-mode'){clearOverlayTimers();window.close()}});
document.addEventListener('keydown',function(event){if(document.body.className!=='setup-mode')return;if((event.keyCode===461||event.keyCode===27)&&document.body.className==='setup-mode'){event.preventDefault();clearOverlayTimers();window.close();return}sources.navigate(event)});
function relaunch(input){var updated=paramsOf(input);if(hasVolume(updated)){if(document.body.className!=='setup-mode'||document.hidden)showOverlay(updated,false)}else showSetup()}
window.webOSRelaunch=function(){var p={};try{p=window.PalmSystem?PalmSystem.launchParams:{}}catch(e){}relaunch(p);return true};
document.addEventListener('webOSRelaunch',function(event){if(event&&event.detail!==undefined)relaunch(event.detail)},true);
var initial={};try{initial=window.PalmSystem?PalmSystem.launchParams:{}}catch(e){}initial=paramsOf(initial);if(hasVolume(initial))showOverlay(initial,false);else showSetup();
}());
</script></body></html>
