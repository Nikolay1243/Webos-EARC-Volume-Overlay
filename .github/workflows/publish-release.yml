name: Publish release
# Publish v1.4.0: unified app, passive volume display, and labeled icon.
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-release.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf,aarch64-unknown-linux-musl
      - run: pip install ziglang cargo-zigbuild
      - run: npm ci
      - run: npm test
      - run: npm run package
      - run: node scripts/release-metadata.mjs
      - name: Publish versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('app/appinfo.json')).version")
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "eARC Volume Overlay v$VERSION" --notes-file "docs/releases/v$VERSION.md"
          fi
          gh release upload "v$VERSION" build/com.github.nikolay1243.earcvolume*.ipk build/release/*.manifest.json --clobber
      - name: Refresh compatibility manifests
        run: |
          cp build/release/*.manifest.json release/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/*.manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Homebrew compatibility manifests for published release"
            git push origin HEAD:main
          fi
