<!doctype html>
<html><head><meta charset="utf-8"><title>eARC Volume Overlay</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;color:#fff;background:transparent}
#setup{display:none;position:absolute;top:0;right:0;bottom:0;left:0;padding:110px 150px;background:radial-gradient(ellipse at 50% 35%,#25252a 0%,#111114 55%,#050506 100%)}body.setup-mode #setup{display:block}.panel{width:940px;margin:0 auto;text-align:center}.mark{width:116px;height:116px;margin:0 auto 30px;border-radius:26px;background:#171719 url('largeIcon.png') center/116px 116px no-repeat}h1{margin:0;font-size:54px;font-weight:300;letter-spacing:-.02em}.description{margin:20px auto 38px;max-width:760px;color:#b7b7bd;font-size:25px;line-height:1.45}#status{display:inline-block;min-width:270px;padding:12px 22px;margin-bottom:42px;border:1px solid #3b3b42;border-radius:999px;background:#19191d;color:#c8c8ce;font-size:22px}#status.enabled{border-color:#3f7255;color:#9fe0b6}#status.error{border-color:#8c4a4a;color:#ffaaaa}.buttons{display:flex;justify-content:center}button{min-width:215px;margin:0 10px;padding:20px 30px;border:2px solid #4a4a51;border-radius:17px;background:#202025;color:#eee;font-size:25px;outline:none}button:focus{border-color:#fff;background:#303037;transform:scale(1.05)}.note{margin-top:42px;color:#77777f;font-size:19px}
#overlay{display:none;position:absolute;right:62px;bottom:62px;min-width:150px;transform:scale(.94);transform-origin:bottom right;opacity:0;padding:23px 28px;text-align:center;background:rgba(16,16,18,.88);border:1px solid rgba(255,255,255,.17);border-radius:22px;box-shadow:0 10px 35px rgba(0,0,0,.48);transition:opacity 150ms ease,transform 180ms ease}body.overlay-mode #overlay{display:block}#overlay.show{opacity:1;transform:scale(1)}#value{font-size:82px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
</style></head><body>
<main id="setup"><div class="panel"><div class="mark"></div><h1>eARC Volume Overlay</h1><p class="description">Shows the soundbar or receiver's numeric volume in the bottom-right corner whenever it changes.</p><div id="status">Checking status…</div><div class="buttons"><button id="enable">Enable</button><button id="disable">Disable</button><button id="test">Test overlay</button></div><p class="note">Requires a rooted TV and Homebrew Channel. Disable the overlay here before uninstalling the app.</p></div></main>
<div id="overlay"><div id="value">0</div></div>
<script>
(function(){
var APP_ID='org.webosbrew.earcvolume',SERVICE='luna://org.webosbrew.hbchannel.service/exec',HOOK='/var/lib/webosbrew/init.d/91-earc-volume-overlay',PIDFILE='/tmp/earc-volume-overlay.pid';
var overlay=document.getElementById('overlay'),value=document.getElementById('value'),status=document.getElementById('status'),closeTimer=null,closeAnimationTimer=null;
var findApp=['APP_DIR=','for BASE in /media/developer/apps/usr/palm/applications /media/cryptofs/apps/usr/palm/applications; do','  if [ -f "$BASE/'+APP_ID+'/runtime/watcher.js" ]; then APP_DIR="$BASE/'+APP_ID+'"; break; fi','done','[ -n "$APP_DIR" ] || { echo app-not-found; exit 1; }'].join('\n');
var enableCommand=[findApp,'mkdir -p /var/lib/webosbrew/init.d','chmod 755 "$APP_DIR/runtime/91-earc-volume-overlay"','ln -sf "$APP_DIR/runtime/91-earc-volume-overlay" "'+HOOK+'"','if [ -f /var/lib/earc-volume-overlay/watcher.pid ]; then','  OLD=$(cat /var/lib/earc-volume-overlay/watcher.pid 2>/dev/null || true)','  [ -z "$OLD" ] || kill "$OLD" 2>/dev/null || true','fi','rm -rf /var/lib/earc-volume-overlay','"'+HOOK+'"','echo enabled'].join('\n');
var disableCommand=['if [ -f "'+PIDFILE+'" ]; then','  PID=$(cat "'+PIDFILE+'" 2>/dev/null || true)','  if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then','    CMD=$(tr "\\000" " " < "/proc/$PID/cmdline" 2>/dev/null || true)','    case "$CMD" in *watcher.js*) kill "$PID" 2>/dev/null || true;; esac','  fi','fi','rm -f "'+PIDFILE+'" "'+HOOK+'"','echo disabled'].join('\n');
var statusCommand=['if [ -L "'+HOOK+'" ] || [ -f "'+HOOK+'" ]; then','  PID=$(cat "'+PIDFILE+'" 2>/dev/null || true)','  if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then echo enabled-running; else echo enabled-stopped; fi','else echo disabled; fi'].join('\n');
function paramsOf(input){var p=input;try{if(typeof p==='string')p=JSON.parse(p)}catch(e){p={}}if(!p||typeof p!=='object')p={};if(p.params&&typeof p.params==='object')p=p.params;return p}
function hasVolume(p){return Object.prototype.hasOwnProperty.call(p,'volume')||Object.prototype.hasOwnProperty.call(p,'mute')}
function rootExec(command,callback){if(!window.PalmServiceBridge){callback(new Error('Homebrew root service is unavailable'));return}var bridge=new PalmServiceBridge();bridge.onservicecallback=function(raw){var response;try{response=JSON.parse(raw)}catch(e){callback(e);return}if(response.returnValue===false||response.error)callback(new Error(response.errorText||response.error||'Command failed'));else callback(null,response.stdoutString||'')};bridge.call(SERVICE,JSON.stringify({command:command}))}
function setStatus(text,kind){status.textContent=text;status.className=kind||''}
function refreshStatus(){setStatus('Checking status…');rootExec(statusCommand,function(error,output){if(error){setStatus(error.message,'error');return}if(output.indexOf('enabled-running')!==-1)setStatus('Enabled and running','enabled');else if(output.indexOf('enabled-stopped')!==-1)setStatus('Enabled; restart required','error');else setStatus('Disabled')})}
function showSetup(){document.body.className='setup-mode';overlay.className='';refreshStatus();window.setTimeout(function(){document.getElementById('enable').focus()},30);if(window.PalmSystem&&PalmSystem.activate)PalmSystem.activate()}
function showOverlay(input,preview){var p=paramsOf(input),n=Number(p.volume);if(!isFinite(n))n=0;n=Math.max(0,Math.min(100,Math.round(n)));value.textContent=(p.mute===true||p.muted===true)?'0':String(n);document.body.className='overlay-mode';overlay.className='';window.setTimeout(function(){overlay.className='show'},20);if(window.PalmSystem&&PalmSystem.activate)PalmSystem.activate();if(closeTimer)window.clearTimeout(closeTimer);if(closeAnimationTimer)window.clearTimeout(closeAnimationTimer);closeTimer=window.setTimeout(function(){overlay.className='';closeAnimationTimer=window.setTimeout(function(){if(preview)showSetup();else window.close()},220)},1850)}
document.getElementById('enable').onclick=function(){setStatus('Enabling…');rootExec(enableCommand,function(error){if(error)setStatus(error.message,'error');else refreshStatus()})};
document.getElementById('disable').onclick=function(){setStatus('Disabling…');rootExec(disableCommand,function(error){if(error)setStatus(error.message,'error');else refreshStatus()})};
document.getElementById('test').onclick=function(){showOverlay({volume:42,mute:false},true)};
document.addEventListener('keydown',function(event){var buttons=Array.prototype.slice.call(document.querySelectorAll('button')),index=buttons.indexOf(document.activeElement);if(event.keyCode===37&&index>0){buttons[index-1].focus();event.preventDefault()}if(event.keyCode===39&&index>=0&&index<buttons.length-1){buttons[index+1].focus();event.preventDefault()}});
window.webOSRelaunch=function(){var updated={};try{updated=window.PalmSystem?PalmSystem.launchParams:{}}catch(e){}updated=paramsOf(updated);if(hasVolume(updated))showOverlay(updated,false);else showSetup();return true};
document.addEventListener('webOSRelaunch',function(event){var updated=paramsOf(event&&event.detail?event.detail:{});if(hasVolume(updated))showOverlay(updated,false);else showSetup()},true);
var initial={};try{initial=window.PalmSystem?PalmSystem.launchParams:{}}catch(e){}initial=paramsOf(initial);if(hasVolume(initial))showOverlay(initial,false);else showSetup();
}());
</script></body></html>
